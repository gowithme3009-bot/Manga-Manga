name: Manga-Manga RSS Radar

on:
  push:
    branches: [manga-manga-v1-work]
    paths-ignore:
      - "data/latest-news.json"
      - "data/daily-drafts.json"
      - "data/trend-signals.json"
      - "data/trend-quality.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manga-manga-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: manga-manga-v1-work
          persist-credentials: true
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le code
        run: |
          npm run check
          npm test
      - name: Collecter les flux RSS et rédiger les prépublications
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          npm run collect
          npm run enrich
          npm run trends
          npm run quality-radar
          npm run drafts
          npm run ai-drafts
      - name: Enregistrer uniquement les données du radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-news.json data/daily-drafts.json data/trend-signals.json data/trend-quality.json
          if ! git diff --cached --quiet; then
            git commit -m "data: actualiser le radar RSS"
            git fetch origin manga-manga-v1-work
            git rebase origin/manga-manga-v1-work
            git push origin HEAD:manga-manga-v1-work
          fi
